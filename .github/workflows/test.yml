name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DDATAZOO_BANNER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      # CI sets GITHUB_ACTIONS, so this also proves the CI suppression path:
      # the tests assert no bytes reach stderr.
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path rust/datazoo-banner/Cargo.toml

  # datazoo_function_doc.hpp is compiled only by the extensions that include it, so
  # compile it here against the real DuckDB headers of every line the fleet builds.
  function-doc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: v1.4.5
          - ref: v1.5.6
          - ref: d54cbbe3df17e8e5ce68312f483b4155836112aa # v2.0.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: ${{ matrix.ref }}
          path: duckdb
      - name: Probe with g++ and clang++
        run: |
          g++ -std=c++17 -fsyntax-only -Wall -Iinclude -Iduckdb/src/include test/function_doc_probe.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Iinclude -Iduckdb/src/include test/function_doc_probe.cpp
